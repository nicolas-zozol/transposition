<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Bloc Gherkin</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bldemo/tokens.css">
<link rel="stylesheet" href="ds/bldemo/components/bundle.css">
<script src="ds/bldemo/components/bundle.js"></script>
<script src="transposition-exemple.js"></script>
<script src="transposition-volumes.js"></script>
<script src="transposition.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" style="padding: {{marge}}; background: {{fond}}">
<div role="group" aria-label="Scénario Gherkin" tabindex="0" style="margin: 0; padding: 12px 16px; overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--background); color: var(--foreground); font: 400 13px/20px var(--tp-mono, ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace); outline: none" style-focus-visible="box-shadow: var(--focus-ring)"><sc-for list="{{lignes}}" as="l" hint-placeholder-count="6"><div style="white-space: pre"><sc-for list="{{l.segs}}" as="s"><span style="color: {{s.c}}; font-weight: {{s.w}}">{{s.t}}</span></sc-for></div></sc-for></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"texte":{"editor":null},"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":760,"height":300}}'>
class Component extends DCLogic {
  renderVals() {
    var T = window.Transposition;
    var seul = this.props.texte == null;
    var texte = this.props.texte;
    if (seul) {
      var d = window.TranspositionExemple;
      texte = d ? d.fonctionnalites[2].regles[0].exemples[0].gherkin : 'Scénario: exemple';
    }
    return {
      lignes: T.gherkin(texte),
      marge: seul ? 'var(--space-6)' : '0',
      fond: seul ? 'var(--card)' : 'transparent',
      theme: seul ? this.props.theme || 'light' : undefined
    };
  }
}
</script>
</body>
</html>
